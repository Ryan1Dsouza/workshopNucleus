plugins { id 'com.android.application' }
android {
    namespace 'workshop.airslice.ble'
    compileSdk 35
    defaultConfig { applicationId 'workshop.airslice.ble'; minSdk 26; targetSdk 35; versionCode 12; versionName '2.0.8' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.register('syncControllerUi', Exec) {
    workingDir rootProject.projectDir.parentFile.parentFile
    commandLine 'node', 'scripts/native/sync-ui.mjs'
}
tasks.named('preBuild').configure { dependsOn 'syncControllerUi' }
