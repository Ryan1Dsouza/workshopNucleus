:root {
  color-scheme: light;
  font-family: "Source Sans 3", "Segoe UI", sans-serif;
  font-synthesis: none;
  color: #233044;
  background: #e9eef3;
  --porcelain: #fafbfc;
  --silver: #e9eef3;
  --ink: #233044;
  --slate: #5b6b7c;
  --blue: #2463c8;
  --green: #18785d;
  --line: #d9e1e9;
  --player-two: #7952b3;
  --heading-font: "Nunito Sans", "Segoe UI", sans-serif;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}

* { box-sizing: border-box; }
body { margin: 0; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
a { color: inherit; }
[hidden] { display: none !important; }
button:focus-visible, a:focus-visible, select:focus-visible,
input:focus-visible, summary:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 4px;
}
svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation: none !important;
    transition: none !important;
  }
}


body {
  display: flex;
  min-height: 100dvh;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  background: var(--silver);
}
[hidden] { display: none !important; }
button { border: 0; user-select: none; -webkit-user-select: none; }
button:focus-visible, summary:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
button[data-control] { touch-action: none; }
button:disabled { opacity: .5; }
.remote-shell {
  width: min(100%, 420px);
  margin: 0 auto auto;
  padding: 22px 24px 18px;
  border: 1px solid white;
  border-radius: 32px;
  background: var(--porcelain);
  box-shadow: 0 14px 36px #23304414, 0 2px 4px #23304408;
}
.remote-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--heading-font); font-size: 14px; font-weight: 800; letter-spacing: -.35px; }
.brand-mark { display: grid; place-items: center; flex: 0 0 auto; width: 28px; height: 28px; border-radius: 9px; background: var(--ink); color: white; font-size: 24px; font-weight: 600; line-height: 1; }
.connection-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 20px; background: #e6ebf1; color: var(--slate); font-size: 11px; font-weight: 600; white-space: nowrap; }
.connection-pill i { width: 5px; height: 5px; border-radius: 50%; background: #8391a1; }
.connection-pill.connected { background: #e1f0e9; color: var(--green); }
.connection-pill.connected i { background: var(--green); }
.connection-pill.preview { background: #e7eefb; color: var(--blue); }
.connection-pill.preview i { background: var(--blue); }
.assignment { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 22px 0 18px; }
h1 { margin: 0; font-family: var(--heading-font); font-size: 23px; font-weight: 800; letter-spacing: -.65px; line-height: 1.2; overflow-wrap: anywhere; }
.player-label { flex: 0 0 auto; padding: 6px 9px; border: 1px solid #d2dce9; border-radius: 8px; color: var(--slate); font-size: 12px; font-weight: 600; }

.remote-body { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 12px 0 22px; }
.direction-zone { margin: 0; }
.dpad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); filter: drop-shadow(0 5px 3px #2330441c); }
.direction, .dpad-center { display: grid; place-items: center; padding: 0; background: var(--ink); color: #e4eaf4; font-size: 22px; box-shadow: inset 0 1px 0 #ffffff24; }
.direction.up { grid-area: 1 / 2; border-radius: 15px 15px 0 0; }
.direction.left { grid-area: 2 / 1; border-radius: 15px 0 0 15px; }
.direction.right { grid-area: 2 / 3; border-radius: 0 15px 15px 0; }
.direction.down { grid-area: 3 / 2; border-radius: 0 0 15px 15px; }
.dpad-center { grid-area: 2 / 2; }
.dpad-center::after { content: ""; width: 24px; height: 24px; border: 1px solid #56677f; border-radius: 50%; }
.direction.is-held { background: var(--blue); color: white; box-shadow: inset 0 3px 5px #15366b55; }
.action-zone, .utility-zone, .number-zone { display: flex; align-items: flex-start; justify-content: center; }
.action-zone { gap: 30px; }
.control-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.action { display: grid; place-items: center; padding: 0; border: 1px solid #cbd6e5; border-radius: 50%; font-family: var(--heading-font); font-size: 31px; font-weight: 800; background: white; color: var(--ink); box-shadow: 0 5px 0 #c9d3e2, 0 8px 12px #23304413; transition: transform .06s, box-shadow .06s, background .06s; }

<script>(function(){
// Neutral controller vocabulary shared by the host, profiles and phone UI.
const BUTTON_IDS = Object.freeze(['up', 'right', 'down', 'left', 'a', 'b', 'one', 'two', 'plus', 'minus', 'home']);
const BUTTON_BITS = Object.freeze(Object.fromEntries(BUTTON_IDS.map((id, index) => [id, 1 << index])));
const BUTTON_MASK = (1 << BUTTON_IDS.length) - 1;
const PROFILE_LIMIT = 4096;

function validateProfile(value) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error('A controller profile must be an object.');
  if (!/^[a-z][a-z0-9-]{0,31}$/.test(value.id)) throw new Error('Invalid profile id.');
  if (typeof value.title !== 'string' || !value.title.trim() || value.title.length > 48) throw new Error('Invalid profile title.');
  if (!['portrait', 'landscape'].includes(value.orientation)) throw new Error('Invalid controller orientation.');
  if (!['none', 'aim', 'steer'].includes(value.motion)) throw new Error('Invalid motion mapping.');
  if (!Array.isArray(value.controls) || value.controls.length > BUTTON_IDS.length) throw new Error('Invalid profile controls.');
  const seen = new Set();
  const controls = value.controls.map(control => {
    if (!control || !BUTTON_IDS.includes(control.id) || seen.has(control.id)) throw new Error('Unsupported or duplicate control.');
    if (typeof control.label !== 'string' || !control.label.trim() || control.label.length > 20) throw new Error('Invalid control label.');
    if (!/^[a-z][a-z0-9.-]{0,39}$/.test(control.action)) throw new Error('Invalid action mapping.');
    seen.add(control.id);
    return { id: control.id, label: control.label, action: control.action };
  });
  const profile = { id: value.id, title: value.title.trim(), orientation: value.orientation, motion: value.motion,
    controls, instruction: typeof value.instruction === 'string' ? value.instruction.slice(0, 160) : '',
    centerLabel: typeof value.centerLabel === 'string' ? value.centerLabel.slice(0, 24) : 'Center motion' };
  if (value.layout !== undefined) {
    if (value.id !== 'kart-racing' || !['kart-gyro','kart-dpad'].includes(value.layout)) throw new Error('Invalid racing layout.');
    profile.layout = value.layout;
  }
  if (value.player !== undefined) {
    if (![1, 2].includes(value.player)) throw new Error('Invalid player assignment.');
    profile.player = value.player;
  }
  if (value.profileEpoch !== undefined) {
    if (!Number.isInteger(value.profileEpoch) || value.profileEpoch < 0 || value.profileEpoch > 65535) throw new Error('Invalid profile epoch.');
    profile.profileEpoch = value.profileEpoch;
  }
  return profile;
}

function buttonState(mask) {
  return Object.fromEntries(BUTTON_IDS.map(id => [id, !!(mask & BUTTON_BITS[id])]));
}

// Multiple fingers may hold the same button. Releasing one must not release all.
class ButtonStore {
  constructor(onChange = () => {}) { this.held = new Map(); this.onChange = onChange; }
  get mask() { let mask = 0; for (const [id, pointers] of this.held) if (pointers.size) mask |= BUTTON_BITS[id]; return mask; }
  press(id, pointer) {
    if (!BUTTON_IDS.includes(id)) return;
    const before = this.mask;
    if (!this.held.has(id)) this.held.set(id, new Set());
    this.held.get(id).add(pointer);
    if (before !== this.mask) this.onChange(this.mask);
  }
  release(pointer) {
    const before = this.mask;
    for (const pointers of this.held.values()) pointers.delete(pointer);
    if (before !== this.mask) this.onChange(this.mask);
  }
  clear() { const before = this.mask; this.held.clear(); if (before) this.onChange(0); }
}

function crc32(bytes) {
  let crc = 0xffffffff;
  for (const byte of bytes) {
    crc ^= byte;
    for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
  }
  return (crc ^ 0xffffffff) >>> 0;
}

function profilePackets(value, transferId) {
  const profile = validateProfile(value);
  const bytes = new TextEncoder().encode(JSON.stringify(profile));
  if (bytes.length > PROFILE_LIMIT) throw new Error('Controller profile exceeds the BLE transfer limit.');
  const begin = new DataView(new ArrayBuffer(9));
  begin.setUint8(0, 0x40); begin.setUint16(1, transferId, true);
  begin.setUint16(3, bytes.length, true); begin.setUint32(5, crc32(bytes), true);
  const packets = [new Uint8Array(begin.buffer)];
  for (let offset = 0; offset < bytes.length; offset += 15) {
    const chunk = bytes.slice(offset, offset + 15), packet = new DataView(new ArrayBuffer(5 + chunk.length));
    packet.setUint8(0, 0x41); packet.setUint16(1, transferId, true); packet.setUint16(3, offset, true);
    new Uint8Array(packet.buffer).set(chunk, 5); packets.push(new Uint8Array(packet.buffer));
  }
  const end = new DataView(new ArrayBuffer(3)); end.setUint8(0, 0x42); end.setUint16(1, transferId, true);
  packets.push(new Uint8Array(end.buffer));
  return packets;
}

function decodeButtonFrame(view) {
  if (!(view instanceof DataView) || view.byteLength !== 7 || view.getUint8(0) !== 4) return null;
  const mask = view.getUint16(1, true);
  if (mask & ~BUTTON_MASK) return null;
  return { mask, sequence: view.getUint16(3, true), profileEpoch: view.getUint16(5, true) };
}

function encodeButtonFrame(mask, sequence, profileEpoch) {
  const view = new DataView(new ArrayBuffer(7)); view.setUint8(0, 4);
  view.setUint16(1, mask & BUTTON_MASK, true); view.setUint16(3, sequence, true); view.setUint16(5, profileEpoch, true);
  return new Uint8Array(view.buffer);
}

function decodeProfileAck(view) {
  return view instanceof DataView && view.byteLength === 6 && view.getUint8(0) === 0x43
    ? { transferId: view.getUint16(1, true), ok: view.getUint8(3) === 0, profileEpoch: view.getUint16(4, true) } : null;
}


const $ = id => document.getElementById(id);
const preview = new URLSearchParams(location.search).get('preview') === '1';
const defaultProfile = {id:'remote',title:'Controller Lab',orientation:'portrait',motion:'aim',centerLabel:'Center motion',
  instruction:'Press a button or turn your wrist. Your input appears on the laptop.',
  controls:BUTTON_IDS.map(id=>({id,label:({one:'1',two:'2',plus:'Plus',minus:'Minus',home:'Home'})[id]||id.toUpperCase(),action:id}))};
let native = {running:false,connected:false,motionAvailable:true,sensing:true,haptics:true,profile:defaultProfile};
let profile = defaultProfile, signature = '', lastMask = 0;
const available = () => !!(window.AndroidController?.post || window.webkit?.messageHandlers?.controller);
function send(payload) {
  const text = JSON.stringify(payload);
  if (window.AndroidController?.post) window.AndroidController.post(text);
  else if (window.webkit?.messageHandlers?.controller) window.webkit.messageHandlers.controller.postMessage(text);
  else if (preview) {
    if (payload.type === 'buttons') parent.postMessage({type:'controller-preview-buttons',mask:payload.mask}, location.origin);
    else if (payload.type === 'center') parent.postMessage({type:'controller-preview-center'}, location.origin);
  } else if (payload.type === 'start') location.href = '/downloads/';
}
const buttons = new ButtonStore(mask => {
  lastMask = mask;
  for (const button of document.querySelectorAll('[data-control]')) button.classList.toggle('is-held', !!(mask & BUTTON_BITS[button.dataset.control]));
  send({type:'buttons',mask});
});
function renderProfile(value) {
  profile = validateProfile(value); buttons.clear();
  const controls = new Map(profile.controls.map(control=>[control.id,control]));
  const shell = document.querySelector('.remote-shell');
  shell.dataset.layout = profile.layout || '';
  // The gyro layout gives the existing right-pad item shortcut its own face.
  // Both touch targets use the same held bit, including simultaneous fingers.
  document.querySelector('[data-face="item"] button').dataset.control = profile.layout === 'kart-gyro' ? 'right' : 'b';
  document.documentElement.dataset.orientation = profile.orientation;
  $('gameTitle').textContent = profile.title;
  $('centerLabel').textContent = profile.centerLabel;
  $('instruction').textContent = profile.instruction;
  $('motionZone').hidden = profile.motion === 'none';
  for (const button of document.querySelectorAll('[data-control]')) {
    const id = button.dataset.control, control = controls.get(id), wrap = button.closest('.control-wrap');
    button.hidden = !control;
    if (wrap) wrap.hidden = !control;
    button.setAttribute('aria-label', control ? id.toUpperCase() + ': ' + control.label : id);
    const label = wrap?.querySelector('[data-label]');
    if (label && control) {
      label.textContent = control.label;
      const symbol = ({a:'A',b:'B',one:'1',two:'2'})[label.dataset.label];
      label.hidden = control.label === symbol;
      if (wrap.dataset.face) {
        const racing = !!profile.layout;
        (button.firstElementChild || button).textContent = racing ? control.label : symbol;
        if (racing) button.setAttribute('aria-label', control.label);
        label.hidden ||= racing;
      }
    }
  }
  $('dpad').hidden = !['up','right','down','left'].some(id=>controls.has(id));
  for (const zone of document.querySelectorAll('.remote-body > section')) zone.hidden = ![...zone.querySelectorAll('[data-control]')].some(button=>!button.hidden);
  document.querySelector('.remote-shell').dataset.hasDpad = String(!$('dpad').hidden);
  document.querySelector('.remote-body').hidden = profile.controls.length === 0;
}
window.onNativeState = value => {
  try {
    const data = typeof value === 'string' ? JSON.parse(value) : value;
    const wasConnected = native.connected;
    native = {...native,...data};
    const next = native.connected ? native.profile || defaultProfile : defaultProfile;
    const nextSignature = JSON.stringify(next);
    if (signature !== nextSignature) { renderProfile(next); signature = nextSignature; }
    if(!native.connected){$('gameTitle').textContent='Your controller';$('instruction').textContent='Start Bluetooth, then choose your phone on the laptop.';}
    if (wasConnected && !native.connected) buttons.clear();
    const usable = native.connected && native.running;
    for (const button of document.querySelectorAll('[data-control]')) button.disabled = !usable;
    document.querySelector('.remote-shell').classList.toggle('is-preview', preview);
    document.querySelector('.remote-shell').classList.toggle('is-connected', !!native.connected);
    $('playerLabel').textContent = native.connected && next.player ? 'Player '+next.player : preview ? 'Demo' : 'No player';
    $('connectionLabel').textContent = preview ? 'Preview' : native.connected ? 'Connected' : native.running ? 'Pair on laptop' : 'Ready to pair';
    $('connectionPill').classList.toggle('connected', !!native.connected);
    $('connectionPill').classList.toggle('preview', preview);
    $('bluetoothLabel').textContent = preview ? 'Desktop preview' : native.running ? 'Stop Bluetooth' : available() ? 'Start Bluetooth' : 'Get the phone app';
    $('bluetoothButton').classList.toggle('connected', !!native.running);
    $('bluetoothButton').disabled = preview;
    // Keep the paired remote focused on gameplay; disconnection remains in options.
    const bluetoothParent = native.connected ? $('extras') : $('status').parentElement;
    if ($('bluetoothButton').parentElement !== bluetoothParent) {
      if (native.connected) bluetoothParent.append($('bluetoothButton'));
      else bluetoothParent.insertBefore($('bluetoothButton'), $('status'));
    }
    $('extras').hidden = !(native.connected || !!window.AndroidController?.post || !!native.update);
    $('hapticsOption').hidden = !native.connected;
    $('motionToggle').checked = !!native.sensing;
    $('motionToggle').disabled = !native.running || !native.motionAvailable;
    $('centerButton').disabled = !usable || !native.motionAvailable || !native.sensing;
    $('motionHint').textContent = !native.motionAvailable ? 'Buttons work without a gyroscope' : native.sensing ? 'Center in your natural grip' : 'Enable when you are ready';
    $('status').textContent = native.status || (native.connected ? 'Input goes directly to your laptop over Bluetooth.' : 'Start here, then connect from the laptop.');
    $('recordButton').hidden = !(native.camera && native.connected);
    $('recordButton').disabled = !usable;
    $('hapticsToggle').checked = !!native.haptics;
    $('hapticsToggle').disabled = !native.running;
    const update = native.update && typeof native.update === 'object' ? native.update : null;
    const showUpdates = !!update || !!window.AndroidController?.post;
    $('updateSection').hidden = !showUpdates;
    if (showUpdates) {
      const info = update || {};
      const busy = !!(info.checking || info.downloading);
      const anyUpdate = !!(info.uiAvailable || info.apkAvailable);
      $('updateSummaryBadge').hidden = !anyUpdate;
      $('appVersionBadge').textContent = info.versionName ? 'v' + info.versionName : 'Installed';
      $('updateStatus').textContent = info.status || (info.apkAvailable
        ? 'ControllerKit v' + (info.latestVersionName || 'latest') + ' is ready to install.'
        : info.uiAvailable
          ? 'A newer controller interface is ready.'
          : 'Check for interface or APK updates.');
      $('checkUpdateButton').disabled = busy;
      $('checkUpdateButton').textContent = info.checking ? 'Checking…' : 'Check updates';
      $('applyUiUpdateButton').hidden = !info.uiAvailable;
      $('applyUiUpdateButton').disabled = busy;
      $('applyUiUpdateButton').textContent = info.downloading === 'ui' ? 'Updating interface…' : 'Update interface';
      $('applyApkUpdateButton').hidden = !info.apkAvailable;
      $('applyApkUpdateButton').disabled = busy;
      $('applyApkUpdateButton').textContent = info.downloading === 'apk'
        ? 'Downloading APK…'
        : ('Install v' + (info.latestVersionName || 'latest'));
    } else {
      $('updateSummaryBadge').hidden = true;
    }
  } catch(error) { $('status').textContent = 'Could not load this controller profile.'; console.error(error); }
};
for (const button of document.querySelectorAll('[data-control]')) {
  button.addEventListener('pointerdown', event => {
    if (button.disabled || button.hidden) return;
    event.preventDefault(); button.setPointerCapture(event.pointerId);
    buttons.press(button.dataset.control, 'pointer:'+event.pointerId);
  });
  for (const type of ['pointerup','pointercancel','lostpointercapture']) button.addEventListener(type,event=>buttons.release('pointer:'+event.pointerId));
}
const keyControls = {ArrowUp:'up',ArrowRight:'right',ArrowDown:'down',ArrowLeft:'left',z:'a',x:'b','1':'one','2':'two','+':'plus','-':'minus',Escape:'home'};
window.addEventListener('keydown', event => {
  const id = keyControls[event.key];
  if (!id || event.repeat || !native.connected || /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
  if (!native.running || !profile.controls.some(control=>control.id===id)) return;
  event.preventDefault(); buttons.press(id,'key:'+event.key);
});
window.addEventListener('keyup',event=>buttons.release('key:'+event.key));
for (const type of ['blur','pagehide']) window.addEventListener(type,()=>buttons.clear());
document.addEventListener('visibilitychange',()=>{if(document.hidden)buttons.clear();});
$('bluetoothButton').addEventListener('click',()=>send({type:native.running?'stop':'start'}));
$('centerButton').addEventListener('click',()=>send({type:'center'}));
$('motionToggle').addEventListener('change',event=>send({type:'motion',enabled:event.target.checked}));
$('hapticsToggle').addEventListener('change',event=>send({type:'haptics',enabled:event.target.checked}));
$('recordButton').addEventListener('click',()=>send({type:'camera'}));
$('checkUpdateButton').addEventListener('click',()=>send({type:'check-update'}));
$('applyUiUpdateButton').addEventListener('click',()=>send({type:'update-ui'}));
$('applyApkUpdateButton').addEventListener('click',()=>send({type:'install-app-update'}));
window.addEventListener('message',event=>{
  if (preview && event.source === parent && event.origin === location.origin && event.data?.type === 'controller-preview-profile') {
    window.onNativeState({running:true,connected:true,sensing:true,motionAvailable:true,profile:event.data.profile,status:'Desktop UI preview. Pair a phone for Bluetooth gameplay.'});
  }
});
window.__controllerUi = {buttons,profile:()=>profile,mask:()=>lastMask};
window.onNativeState(preview ? {running:true,connected:true,status:'Desktop UI preview.'} : native);
send({type:'ready'});

})();</script>
