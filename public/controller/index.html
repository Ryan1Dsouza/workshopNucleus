<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9eef3">
<title>ControllerKit · Phone remote</title>
<link rel="stylesheet" href="./phone.css">
</head>
<body>
<main class="remote-shell" aria-label="Game controller">
  <header class="remote-header">
    <div class="brand"><span class="brand-mark" aria-hidden="true">+</span><span>ControllerKit</span></div>
    <span class="connection-pill" id="connectionPill"><i></i><span id="connectionLabel">Ready to pair</span></span>
  </header>
  <section class="assignment">
    <div><h1 id="gameTitle">Your controller</h1></div>
    <span id="playerLabel" class="player-label">Not assigned</span>
  </section>
  <div class="remote-body">
    <section class="direction-zone" aria-label="Directional pad">
      <div class="dpad" id="dpad">
        <button data-control="up" class="direction up" aria-label="Up"><span>▲</span></button>
        <button data-control="left" class="direction left" aria-label="Left"><span>◀</span></button>
        <span class="dpad-center" aria-hidden="true"></span>
        <button data-control="right" class="direction right" aria-label="Right"><span>▶</span></button>
        <button data-control="down" class="direction down" aria-label="Down"><span>▼</span></button>
      </div>
    </section>
    <section class="action-zone" aria-label="Action buttons">
      <div class="control-wrap" data-face="drift"><button data-control="a" class="action action-a"><span>A</span></button><span data-label="a" class="control-caption">A</span></div>
      <div class="control-wrap" data-face="item"><button data-control="b" class="action action-b"><span>B</span></button><span data-label="b" class="control-caption">B</span></div>
    </section>
    <section class="utility-zone" aria-label="Menu buttons">
      <div class="control-wrap"><button data-control="minus" class="utility" aria-label="Minus">−</button><span data-label="minus" class="control-caption">Minus</span></div>
      <div class="control-wrap"><button data-control="home" class="utility home" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M6 9v12h5v-7h2v7h5V9"/></svg></button><span data-label="home" class="control-caption">Home</span></div>
      <div class="control-wrap"><button data-control="plus" class="utility" aria-label="Plus">+</button><span data-label="plus" class="control-caption">Plus</span></div>
    </section>
    <section class="number-zone" aria-label="Secondary buttons">
      <div class="control-wrap" data-face="brake"><button data-control="one" class="number">1</button><span data-label="one" class="control-caption">1</span></div>
      <div class="control-wrap" data-face="accelerate"><button data-control="two" class="number">2</button><span data-label="two" class="control-caption">2</span></div>
    </section>
  </div>
  <section class="motion-zone" id="motionZone">
    <div class="motion-controls">
      <button class="center-button" id="centerButton"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/></svg><span id="centerLabel">Center motion</span></button>
      <label class="motion-toggle"><span>Motion</span><input id="motionToggle" type="checkbox" checked aria-label="Enable wrist motion"><span class="switch" aria-hidden="true"></span></label>
    </div>
    <p id="motionHint" class="motion-hint">Center in your natural grip</p>
  </section>
  <p id="instruction" class="instruction">Start Bluetooth here, then choose your phone on the laptop.</p>
  <footer class="remote-footer">
    <button id="bluetoothButton" class="bluetooth-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10-5 4V3l5 4L7 17"/></svg><span id="bluetoothLabel">Start Bluetooth</span></button>
    <p id="status" role="status">Ready when you are.</p>
    <details id="extras"><summary>Controller options</summary><label class="option"><input id="hapticsToggle" type="checkbox" checked> Vibration feedback</label><button id="recordButton" class="record-button" hidden>Open camera</button></details>
  </footer>
</main>
<script type="module" src="./phone-ui.mjs"></script>
</body>
</html>
